sync:
  interval_minutes: 60
  retention_days: 30
sources:
  - provider: telegram
    enabled: true
    defaults:
      stream_mode: proxy
      max_pages: 3
      min_duration_seconds: 90
      history_batch_size: 25
      tags_whitelist: []
      tags_blacklist: []
    channels:
      - id: "-10012345"
        studio: "Shared Fixture Active"
        enabled: true
      - id: "-10054321"
        studio: "Shared Fixture Disabled"
        enabled: false
  - provider: secondweb
    enabled: true
    address: "https://user:password@private.invalid/feed?token=fixture-secret"
    stream_mode: redirect
    sections: ["Scene", "Featured"]
    max_pages: 7
