name: Public test suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  container-images-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate production Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build images and start isolated PostgreSQL and resolver stack
        run: |
          compose=(docker compose -f docker-compose.dev.yml -p adult-hub-ci)
          "${compose[@]}" up --build -d
          for attempt in $(seq 1 30); do
            if "${compose[@]}" exec -T resolver python3 -c \
              "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/admin/health/ready', timeout=2)"; then
              exit 0
            fi
            sleep 2
          done
          "${compose[@]}" logs --no-color
          exit 1
      - name: Stop isolated smoke stack
        if: always()
        run: docker compose -f docker-compose.dev.yml -p adult-hub-ci down --volumes --remove-orphans

  public-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: adult_hub_test
          POSTGRES_USER: adult_hub
          POSTGRES_PASSWORD: adult_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adult_hub -d adult_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: |
            resolver/requirements.lock
            sync/requirements.lock
            requirements-dev.lock
      - name: Install ffmpeg
        # Both production images install it; the pHash generation path refuses
        # to run without it, so the suite needs it to exercise that branch.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install public test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps ./common
      - name: Set up Node.js for JavaScript lint
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install JavaScript lint dependencies
        run: npm ci
      - name: Run Ruff lint
        run: make lint
      - name: Run required public suite with coverage
        env:
          ADULT_HUB_TEST_PROFILE: full
          CONFIG_PATH: tests/fixtures/config_telegram_only.yaml
          CACHE_DB_PATH: ${{ runner.temp }}/adult-hub-stream-cache.db
          TELEGRAM_FINGERPRINT_USAGE_PATH: ${{ runner.temp }}/telegram-fingerprint-daily-usage.json
          SYNC_ACTIVITY_LOG_PATH: ${{ runner.temp }}/sync-activity.log
          TEST_DATABASE_URL: postgresql://adult_hub:adult_hub_test@localhost:5432/adult_hub_test
        run: |
          make coverage
          make proxy-origin
      - name: Run Admin UI and v2 browser contracts
        run: make ui-contracts
      - name: Check Admin v2 JavaScript syntax
        run: make js-check
