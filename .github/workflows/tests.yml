name: Public test suite

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: adult_hub_test
          POSTGRES_USER: adult_hub
          POSTGRES_PASSWORD: adult_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adult_hub -d adult_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
          cache: pip
          cache-dependency-path: |
            resolver/requirements.lock
            sync/requirements.lock
            requirements-dev.lock
      - name: Install public test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps ./common
      - name: Run Ruff lint
        run: make lint
      - name: Run required public suite with coverage
        env:
          ADULT_HUB_TEST_PROFILE: full
          CONFIG_PATH: tests/fixtures/config_telegram_only.yaml
          CACHE_DB_PATH: ${{ runner.temp }}/adult-hub-stream-cache.db
          TELEGRAM_FINGERPRINT_USAGE_PATH: ${{ runner.temp }}/telegram-fingerprint-daily-usage.json
          SYNC_ACTIVITY_LOG_PATH: ${{ runner.temp }}/sync-activity.log
          TEST_DATABASE_URL: postgresql://adult_hub:adult_hub_test@localhost:5432/adult_hub_test
        run: |
          make coverage
          make proxy-origin
      - name: Run Admin UI and v2 browser contracts
        run: make ui-contracts
      - name: Check Admin v2 JavaScript syntax
        run: make js-check
