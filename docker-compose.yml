# 'make deploy' exports APP_VERSION from the VERSION file, so release images are
# tagged after the code they were built from. A bare 'docker compose' command
# falls back to ':dev', which is fine for ad-hoc work; the reported application
# version always comes from VERSION, never from this tag.
services:
  jellyfin:
    image: jellyfin/jellyfin:12.4
    container_name: jellyfin
    restart: unless-stopped
    # Compose's service_healthy dependency below needs an explicit condition
    # here; this also keeps readiness behavior visible alongside the service.
    healthcheck:
      test: ["CMD-SHELL", "curl --noproxy 'localhost' -Lk -fsS http://localhost:8096/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Host networking supports native DLNA / UPnP discovery on Debian
    network_mode: host
    environment:
      - JELLYFIN_PublishedServerUrl=http://${HOST_IP:-127.0.0.1}:8096
      - JELLYFIN_FFMPEG_FAST_PROBE=${JELLYFIN_FFMPEG_FAST_PROBE:-true}
      - JELLYFIN_FFMPEG_ANALYZE_DURATION=${JELLYFIN_FFMPEG_ANALYZE_DURATION:-5M}
      - JELLYFIN_FFMPEG_PROBE_SIZE=${JELLYFIN_FFMPEG_PROBE_SIZE:-10M}
    command: ["--ffmpeg", "/usr/local/bin/ffmpeg"]
    volumes:
      - ./jf-config:/config
      - ./jf-cache:/cache
      - ${MEDIA_DIR:-${MEDIA_PATH:-./media/adult}}:/media/adult:ro
      - ./scripts/jellyfin-ffmpeg.sh:/usr/local/bin/ffmpeg:ro
      - ./scripts/jellyfin-ffprobe.sh:/usr/local/bin/ffprobe:ro
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "44"
      - "992"

  resolver:
    image: ${RESOLVER_IMAGE:-adult-hub-resolver:${APP_VERSION:-dev}}
    build:
      context: .
      dockerfile: resolver/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: adult-resolver
    restart: unless-stopped
    networks:
      - default
      - selfhost
    ports:
      # LAN + tailnet (0.0.0.0): resolver may also serve local clients
      # outside loopback. This does not open internet access by itself (home NAT,
      # no port forwarding; DNS points to 100.x). Public HTTPS access goes through Caddy.
      - "8090:8090"
    environment:
      - TZ=${TZ:-Europe/Warsaw}
      - PYTHONUNBUFFERED=1
      - APP_VERSION=${APP_VERSION:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-${STANDALONE_DATABASE_URL:-}}
      - ENABLE_ADMIN=${ENABLE_ADMIN:-true}
      - ADMIN_PUBLIC=${ADMIN_PUBLIC:-${STANDALONE_ADMIN_PUBLIC:-false}}
      - ADMIN_WRITE_TOKEN=${ADMIN_WRITE_TOKEN:-${ADMIN_DUPLICATE_TOKEN:-}}
      - ADMIN_DUPLICATE_TOKEN=${ADMIN_DUPLICATE_TOKEN:-}
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-media.example.org}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-${RESOLVER_TRUSTED_PROXY_IPS:-127.0.0.1,::1}}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_SESSION_PATH=${TELEGRAM_SESSION_PATH:-/data/telegram.session}
      - TELEGRAM_SIGNATURE_CHANNEL=${TELEGRAM_SIGNATURE_CHANNEL:-}
      - TELEGRAM_CHANNEL_NAME_HINTS=${TELEGRAM_CHANNEL_NAME_HINTS:-}
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - STASHDB_API_KEY=${STASHDB_API_KEY:-${STASH_API_KEY:-}}
      - STASH_API_KEY=${STASH_API_KEY:-}
      - STASHDB_API_URL=${STASHDB_API_URL:-https://stashdb.org/graphql}
      - THEPORNDB_API_TOKEN=${THEPORNDB_API_TOKEN:-${THEPORNDB_API_KEY:-}}
      - THEPORNDB_API_KEY=${THEPORNDB_API_KEY:-}
      - RESOLVER_WATCHDOG_INTERVAL_SECONDS=${RESOLVER_WATCHDOG_INTERVAL_SECONDS:-10}
      - RESOLVER_WATCHDOG_TIMEOUT_SECONDS=${RESOLVER_WATCHDOG_TIMEOUT_SECONDS:-4}
      - RESOLVER_WATCHDOG_FAILURES=${RESOLVER_WATCHDOG_FAILURES:-3}
      - RESOLVER_WATCHDOG_STARTUP_GRACE_SECONDS=${RESOLVER_WATCHDOG_STARTUP_GRACE_SECONDS:-45}
      - CONFIG_PATH=${CONFIG_PATH:-/config/config.yaml}
      - ADMIN_SOURCE_OVERRIDES_PATH=${ADMIN_SOURCE_OVERRIDES_PATH:-/data/admin-source-overrides.json}
      - DATA_DIR=${DATA_DIR:-/data}
      - MEDIA_DIR=/media/adult
      - BACKUP_DIR=/data/backups
      - BACKUP_RESTORE_DATABASE_URL=${BACKUP_RESTORE_DATABASE_URL:-}
      - RESOLVER_CONCURRENCY_LIMIT=${RESOLVER_CONCURRENCY_LIMIT:-10}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-1500}
      - MAX_CACHE_ENTRIES=${MAX_CACHE_ENTRIES:-2000}
      - ADMIN_V2_MONITOR_BACKUPS=${ADMIN_V2_MONITOR_BACKUPS:-false}
      - PHASH_UPLOAD_ENABLED=${PHASH_UPLOAD_ENABLED:-false}
      - VIDEO_VISUAL_WORKER_ENABLED=${VIDEO_VISUAL_WORKER_ENABLED:-false}
      - PHASH_ACCEPTED_DECODER_PROFILES=${PHASH_ACCEPTED_DECODER_PROFILES:-}
      - PHASH_ALLOWED_USER_IDS=${PHASH_ALLOWED_USER_IDS:-}
      - TELEGRAM_FINGERPRINT_DAILY_BYTE_BUDGET=${TELEGRAM_FINGERPRINT_DAILY_BYTE_BUDGET:-30000000000}
      - TELEGRAM_FINGERPRINT_MAX_BYTES_PER_SECOND=${TELEGRAM_FINGERPRINT_MAX_BYTES_PER_SECOND:-2097152}
      - TELEGRAM_FINGERPRINT_USAGE_PATH=${TELEGRAM_FINGERPRINT_USAGE_PATH:-/data/cache/telegram-fingerprint-daily-usage.json}
      - PHASH_SERVER_BYTE_BUDGET=${PHASH_SERVER_BYTE_BUDGET:-${TELEGRAM_PHASH_BYTE_BUDGET:-268435456}}
      - PHASH_SERVER_TIMEOUT_SECONDS=${PHASH_SERVER_TIMEOUT_SECONDS:-1200}
      - PHASH_SERVER_BYTES_PER_SECOND=${PHASH_SERVER_BYTES_PER_SECOND:-2097152}
      - PHASH_SERVER_IDLE_BYTES_PER_SECOND=${PHASH_SERVER_IDLE_BYTES_PER_SECOND:-10000000}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/admin/health/ready')"]
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 10s
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config.yaml:/config/config.yaml:ro
      - ./data/cache:/cache
      - ./data:/data
      - ${MEDIA_DIR:-${MEDIA_PATH:-./media/adult}}:/media/adult

  sync:
    image: ${SYNC_IMAGE:-adult-hub-sync:${APP_VERSION:-dev}}
    build:
      context: .
      dockerfile: sync/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    container_name: adult-sync
    restart: unless-stopped
    # The sync child answers SIGTERM at its next channel or stage boundary and the runner
    # waits sync.shutdown_grace_seconds (180s by default) for that drain. Docker's
    # 10s default would SIGKILL first and put us back to interrupted batches.
    stop_grace_period: 4m
    mem_limit: 1g
    networks:
      - default
      - selfhost
    depends_on:
      resolver:
        condition: service_healthy
      # Sync pushes library refreshes to Jellyfin; wait until its /health responds.
      jellyfin:
        condition: service_healthy
    healthcheck:
      # Freshness of the worker capabilities heartbeat (published every 5s, stale after 15s).
      test: ["CMD-SHELL", "python3 -c \"import os,sys; from common.worker_capabilities import read_worker_capabilities; sys.exit(0 if read_worker_capabilities(os.environ.get('ADMIN_WORKER_CAPABILITIES_PATH', '/data/cache/worker-capabilities.json'))['available'] else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=${TZ:-Europe/Warsaw}
      - PYTHONUNBUFFERED=1
      - APP_VERSION=${APP_VERSION:-dev}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL:-${STANDALONE_DATABASE_URL:-}}
      - BACKUP_RESTORE_DATABASE_URL=${BACKUP_RESTORE_DATABASE_URL:-}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
      - BACKUP_DAILY_AT=${BACKUP_DAILY_AT:-04:30}
      - RESOLVER_PUBLIC_URL=${RESOLVER_PUBLIC_URL:-http://127.0.0.1:8090}
      - STREAM_PUBLIC_URL_TELEGRAM=${STREAM_PUBLIC_URL_TELEGRAM:-}
      - RESOLVER_API_URL=${RESOLVER_API_URL:-http://resolver:8090}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_SESSION_PATH=${TELEGRAM_SESSION_PATH:-/data/telegram.session}
      - TELEGRAM_SIGNATURE_CHANNEL=${TELEGRAM_SIGNATURE_CHANNEL:-}
      - TELEGRAM_CHANNEL_NAME_HINTS=${TELEGRAM_CHANNEL_NAME_HINTS:-}
      - HIDE_DEAD_STREAMS=${HIDE_DEAD_STREAMS:-true}
      - DUPLICATE_AUTO_MERGE_ENABLED=${DUPLICATE_AUTO_MERGE_ENABLED:-false}
      - DUPLICATE_AUTO_MERGE_TELEGRAM_FILE_ID=${DUPLICATE_AUTO_MERGE_TELEGRAM_FILE_ID:-true}
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      - STASHDB_API_KEY=${STASHDB_API_KEY:-${STASH_API_KEY:-}}
      - STASH_API_KEY=${STASH_API_KEY:-}
      - STASHDB_API_URL=${STASHDB_API_URL:-https://stashdb.org/graphql}
      - THEPORNDB_API_TOKEN=${THEPORNDB_API_TOKEN:-${THEPORNDB_API_KEY:-}}
      - THEPORNDB_API_KEY=${THEPORNDB_API_KEY:-}
      - TELEGRAM_OSHASH_BACKFILL_PER_RUN=${TELEGRAM_OSHASH_BACKFILL_PER_RUN:-200}
      - TELEGRAM_FINGERPRINTS_ENABLED=${TELEGRAM_FINGERPRINTS_ENABLED:-true}
      - TELEGRAM_PHASH_ENABLED=${TELEGRAM_PHASH_ENABLED:-true}
      - TELEGRAM_AVAILABILITY_CHECKS_PER_RUN=${TELEGRAM_AVAILABILITY_CHECKS_PER_RUN:-20}
      - TELEGRAM_FINGERPRINT_DAILY_BYTE_BUDGET=${TELEGRAM_FINGERPRINT_DAILY_BYTE_BUDGET:-30000000000}
      - TELEGRAM_FINGERPRINT_MAX_BYTES_PER_SECOND=${TELEGRAM_FINGERPRINT_MAX_BYTES_PER_SECOND:-2097152}
      - TELEGRAM_FINGERPRINT_USAGE_PATH=${TELEGRAM_FINGERPRINT_USAGE_PATH:-/data/cache/telegram-fingerprint-daily-usage.json}
      - TELEGRAM_PHASH_BYTE_BUDGET=${TELEGRAM_PHASH_BYTE_BUDGET:-268435456}
      - TELEGRAM_PHASH_TIMEOUT_SECONDS=${TELEGRAM_PHASH_TIMEOUT_SECONDS:-1200}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config.yaml:/config/config.yaml:ro
      - ${MEDIA_DIR:-${MEDIA_PATH:-./media/adult}}:/media/adult
      - ./data:/data
      # cleanup_old_transcodes() uses /transcodes.
      - ./jf-cache/transcodes:/transcodes

networks:
  selfhost:
    external: true
