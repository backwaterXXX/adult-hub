# Example Adult Hub configuration
# Copy this file to config.yaml and edit it for your setup:
#   cp config.example.yaml config.yaml
#
# Credentials (TELEGRAM_API_ID, TELEGRAM_API_HASH, JELLYFIN_API_KEY,
# THEPORNDB_API_TOKEN)
# and infrastructure settings (HOST_IP, MEDIA_PATH, RESOLVER_PUBLIC_URL)
# belong in .env.

sync:
  interval_minutes: 60              # Minutes between sync runs (used if daily_at is omitted)
  daily_at: "03:30"                 # Optional: daily sync time in HH:MM format (local time)
  run_on_startup: true              # Whether to run a sync immediately when the container starts
  retention_days: 30                # Remove videos not seen for this many days
  retry_backoff_base_seconds: 30    # Initial retry delay after an error
  retry_backoff_max_seconds: 1800   # Maximum retry delay
  shutdown_grace_seconds: 180       # How long a restart waits for the running sync to reach its
                                    # next channel boundary (compose stop_grace_period must exceed it)
  stream_mode_default: redirect     # Default playback mode: redirect or proxy
  category_fetch_delay_seconds: 2.5  # Pause between upstream category requests
  pbc_backfill_per_run: 50
  tpdb_backfill_per_run: 50
  # Scene and performer source queues: ~20 daily syncs per 10k videos / 1k actors.
  scene_backfill_per_run: 500
  jellyfin_people_per_run: 25

sources:
  - provider: telegram
    enabled: true
    defaults:
      stream_mode: proxy
      max_pages: 1
      min_duration_seconds: 420
      history_batch_size: 100
      tags_whitelist: []
      tags_blacklist: []
    channels:
      - id: "@example_channel_public"
        enabled: false
        studio: "Example Studio"
