[tool.coverage.run]
source = ["common", "resolver", "sync"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
skip_empty = true
# Facade modules import through a try/except so they run both as a package and
# as top-level scripts; the fallback branch is unreachable under the test run.
exclude_also = [
    "if TYPE_CHECKING:",
    "except ImportError:",
    # The CLI entry guard runs the same main() the suites already cover.
    "if __name__ == .__main__.:",
]
