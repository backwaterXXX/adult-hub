[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Correctness rules plus the whitespace/comprehension families that the
# repository now satisfies. Import sorting (I001) stays off: entry points and
# tests must mutate sys.path before importing project modules, so reordering
# their imports would break them.
select = ["E4", "E7", "E9", "F", "B023", "W", "C4", "PIE790", "RUF100", "C90", "T20", "G", "LOG"]

[tool.ruff.lint.mccabe]
# Ruff default: flag functions whose cyclomatic complexity exceeds 10.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# These entry points deliberately add repository directories to sys.path
# before importing project modules; test modules use the same bootstrap.
# sync.py remains a compatibility facade for scripts that import its helpers.
# T201: command-line tools print their results to stdout.
# C901/G004: existing violations, recorded per file. Remove an entry once its
# file no longer has the violation, so the file is gated again.
"backup_db.py" = ["C901", "T201"]
"backup_scheduler.py" = ["C901"]
"common/admin_audit_events.py" = ["C901"]
"common/admin_operation_duplicate_handlers.py" = ["C901"]
